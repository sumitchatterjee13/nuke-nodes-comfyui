[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuke-nodes"
description = "ComfyUI custom nodes that replicate Nuke compositing functionality"
# NOTE: keep in sync with __version__ in version.py
version = "2.0.1"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]


[project.urls]
Repository = "https://github.com/sumitchatterjee13/nuke-nodes-comfyui"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.910"
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.yaml", "*.yml"]

[tool.comfy]
PublisherId = "sumit"
DisplayName = "Nuke Nodes"
requires-comfyui = ">=0.3.0"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
